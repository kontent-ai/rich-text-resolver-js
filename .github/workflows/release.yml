name: Release

on:
  push:
    branches:
      - main

permissions: {}

env:
  CI: true

jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v6
        with:
          # changesets/action authenticates its own push via the ~/.netrc it writes,
          # so no token needs to sit in .git/config while install/build scripts run.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
      
      - name: Create and publish versions
        uses: changesets/action@v1
        with:
          commit: "changeset: update versions"
          title: "changeset: update versions"
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}